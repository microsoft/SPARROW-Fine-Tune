[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparrow-yolo-workbench"
version = "0.2.0"
description = "Pascal VOC to YOLO dataset preparation and Ultralytics training for SPARROW camera-trap datasets"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.3.0,<8.4",
    "numpy>=1.26",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "Pillow>=10.0",
    "tqdm>=4.65",
    "matplotlib>=3.7",
    "opencv-python>=4.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "scikit-learn>=1.4",
    "onnx>=1.15",
    "onnxruntime>=1.18",
    "torch>=2.8,<2.12",
    "torchvision>=0.23,<0.27",
    "httpx>=0.27",
    "timm>=1.0,<2",
    "onnxscript>=0.7.2",
]

[project.optional-dependencies]
export = ["onnx>=1.15", "onnxslim>=0.1.34", "onnxruntime>=1.18"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "skl2onnx>=1.17"]
e2e = ["playwright>=1.45"]

[project.scripts]
sparrow-yolo = "sparrow_yolo.cli:main"
sparrow-finetune = "sparrow_finetune.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sparrow_finetune = ["db/migrations/*.sql", "ui/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

# The host NVIDIA driver supports CUDA 12.8; default PyPI torch wheels target newer CUDA
# and report cuda.is_available() == False there (FT-3).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
